<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She-Shield</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <header>
        <div class="logo">🛡️</div>
        <h1>She<span>-Shield</span></h1>
        <p>Women's Health & Safety Assistant</p>
    </header>

    <aside class="sidebar">
        <div class="sidebar-title">Quick Topics</div>
        <button class="topic-btn" onclick="askTopic('What is PCOS?')">
            <span class="icon">🩺</span> PCOS
        </button>
        <button class="topic-btn" onclick="askTopic('Tell me about menstrual health')">
            <span class="icon">🌸</span> Menstrual Health
        </button>
        <button class="topic-btn" onclick="askTopic('I am feeling anxious and stressed')">
            <span class="icon">🧠</span> Mental Health
        </button>
        <button class="topic-btn" onclick="askTopic('Tips for good nutrition')">
            <span class="icon">🥗</span> Nutrition
        </button>
        <button class="topic-btn" onclick="findHospitals()">
            <span class="icon">🏥</span> Find Hospital
        </button>
        <div class="sidebar-divider"></div>
        <div class="sidebar-title">Resources</div>
        <button class="topic-btn" onclick="askTopic('What are signs I should see a doctor?')">
            <span class="icon">⚕️</span> See a Doctor?
        </button>
        <button class="topic-btn" onclick="askTopic('Self care tips for women')">
            <span class="icon">💆</span> Self Care
        </button>
        <div class="sos-sidebar" onclick="sendSOS()">
            <span class="sos-icon">🚨</span>
            <div class="sos-label">SOS</div>
            <div class="sos-sub">Tap in emergency</div>
        </div>
    </aside>

    <div class="chat-box" id="chat-box">
        <!-- Mobile toolbar -->
        <div class="mobile-toolbar">
            <button class="mobile-btn" onclick="findHospitals()">🏥 Hospital</button>
            <button class="mobile-btn" onclick="askTopic('What is PCOS?')">🩺 PCOS</button>
            <button class="mobile-btn" onclick="askTopic('I am feeling anxious')">🧠 Mental Health</button>
            <button class="mobile-btn" onclick="askTopic('Nutrition tips for women')">🥗 Nutrition</button>
            <button class="mobile-btn" onclick="askTopic('Self care tips')">💆 Self Care</button>
        </div>

        <div class="message bot">
            Hi! I'm She-Shield 🛡️ I'm here to help you with women's health questions, find nearby hospitals, or send an SOS alert in emergencies. How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask me anything..." />
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- SOS floating button for mobile -->
    <button class="sos-mobile" onclick="sendSOS()">🚨</button>

    <!-- Hospital Modal -->
    <div id="hospital-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#13131f; border:1px solid rgba(233,69,96,0.3); border-radius:20px; width:90%; max-width:700px; padding:24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h2 style="color:#e94560; font-family:'Playfair Display',serif;">🏥 Nearby Hospitals</h2>
                <button onclick="closeHospital()" style="background:none; border:none; color:#a8b2d8; font-size:1.5rem; cursor:pointer;">✕</button>
            </div>
            <div id="map" style="height:400px; border-radius:12px;"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
